<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="应用文写作工坊">
<meta name="format-detection" content="telephone=no">
<title>应用文写作工坊 · 提示词打磨 + 多篇成稿</title>
<style>
:root{
  --bg:#f4f6f3; --panel:#ffffff; --panel2:#fafbf9; --line:#dfe4dc; --line2:#eceee9;
  --ink:#1f2724; --ink2:#4d5852; --ink3:#8a948d;
  --green:#1f6f52; --green2:#2e8a67; --greensoft:#e7f1ec;
  --gold:#a8761f; --goldsoft:#f8f1e2;
  --red:#b23b3b; --redsoft:#fbecec;
  --blue:#2f5d8a; --bluesoft:#eaf1f8;
  --radius:12px; --shadow:0 1px 3px rgba(31,39,36,.07), 0 8px 24px rgba(31,39,36,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Source Han Serif SC","Songti SC","Noto Serif CJK SC",-apple-system,"Segoe UI","Microsoft YaHei",serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd6cd;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.scroll-x{-webkit-overflow-scrolling:touch}

/* ---------- 布局 ---------- */
.app{
  display:flex;flex-direction:column;overflow:hidden;
  height:100vh; height:100dvh;
}
.topbar{
  display:flex;align-items:center;gap:14px;background:var(--green);
  color:#fff;flex:0 0 auto;box-shadow:0 1px 6px rgba(0,0,0,.12);z-index:20;
  padding:10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right));
}
.menu-btn{display:none;flex:0 0 auto;width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
  align-items:center;justify-content:center;padding:0}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{
  display:block;width:16px;height:2px;background:#fff;border-radius:2px;position:relative;content:""}
.menu-btn span::before{position:absolute;top:-5px;left:0}
.menu-btn span::after{position:absolute;top:5px;left:0}
.brand{font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;min-width:0}
.brand .bk{width:22px;height:26px;background:#e8f0e9;border-radius:2px 5px 5px 2px;position:relative;flex:0 0 auto}
.brand .bk::after{content:"";position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-left:2px solid var(--green);opacity:.5}
.brand .b-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .b-ico{display:none;white-space:nowrap}
.brand small{font-weight:400;font-size:12px;opacity:.85;letter-spacing:0}
.topbar .spacer{flex:1}
.tb-meta{font-size:12.5px;opacity:.9;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:2px 9px;border-radius:20px;font-size:12px;white-space:nowrap}
.pill.ok{background:rgba(255,255,255,.9);color:var(--green);border-color:#fff}
.pill.warn{background:#7a4a12;border-color:#a8761f}

.body{display:flex;flex:1;min-height:0;position:relative}
.side{
  width:246px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:29}
.scrim.on{display:block}
.side-h{padding:11px 14px 8px;font-size:12.5px;color:var(--ink3);display:flex;align-items:center}
.side-h .spacer{flex:1}
.projlist{overflow:auto;flex:1;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
.proj{padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.proj:hover{background:var(--panel2);border-color:var(--line2)}
.proj.on{background:var(--greensoft);border-color:#c3ddd1}
.proj .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .s{font-size:11.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px}
.side-f{padding:9px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;
  padding-bottom:calc(9px + env(safe-area-inset-bottom))}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{
  display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);
  flex:0 0 auto;padding:8px 16px 0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 15px;border:1px solid transparent;border-bottom:none;background:transparent;
  border-radius:9px 9px 0 0;font-size:14px;color:var(--ink2);position:relative;top:1px;
  white-space:nowrap;flex:0 0 auto
}
.tab:hover{background:var(--panel2)}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--green);font-weight:700}
.tab .n{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;
  background:var(--line);color:var(--ink2);font-size:11px;margin-right:6px;font-weight:700}
.tab.on .n{background:var(--green);color:#fff}
.tab.done .n::after{content:""}
.tab .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}

.work{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.15fr);gap:16px;align-items:start}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px;background:var(--panel2)}
.card-h h3{margin:0;font-size:14.5px;letter-spacing:.3px}
.card-h .spacer{flex:1}
.card-h .hint{font-size:12px;color:var(--ink3);font-weight:400}
.card-b{padding:15px}
.card-b.tight{padding:0}

.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field > label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field .sub{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:6px}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;
  font-size:14px;transition:border-color .15s,box-shadow .15s
}
textarea{resize:vertical;line-height:1.65;font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,138,103,.12)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}
.row3 > *{flex:1}

.btn{
  padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  font-size:13.5px;transition:.15s;white-space:nowrap
}
.btn:hover{border-color:var(--green2);color:var(--green);background:var(--greensoft)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--green2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.warn{border-color:#e6cdc0;color:#8a4a1f}
.btn.warn:hover{background:#fdf4ee;border-color:#d9a480;color:#8a4a1f}
.btn.danger{color:var(--red);border-color:#eccfcf}
.btn.danger:hover{background:var(--redsoft);border-color:#dfa8a8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;
  cursor:pointer;transition:.13s;display:flex;align-items:center;gap:5px
}
.chip:hover{border-color:var(--green2);background:var(--greensoft)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.chip .cat{font-size:10.5px;opacity:.6}

.tip{font-size:12px;color:var(--ink3);line-height:1.6}
.note{background:var(--goldsoft);border:1px solid #eadcbe;border-radius:9px;padding:9px 12px;font-size:12.5px;color:#6b5320}
.note.green{background:var(--greensoft);border-color:#c9e0d5;color:#20513d}
.note.blue{background:var(--bluesoft);border-color:#cddff0;color:#28496b}
.note b{color:inherit}

.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.kv dt{color:var(--ink3);white-space:nowrap}
.kv dd{margin:0}

/* 提示词 / 正文 显示区 */
.doc{
  background:#fcfdfb;border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  font-family:"Cascadia Mono","SF Mono",Consolas,"Microsoft YaHei",monospace;font-size:12.8px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;max-height:460px;overflow:auto
}
.doc.serif{font-family:"Source Han Serif SC","Songti SC",Georgia,serif;font-size:14.5px;line-height:1.95;background:#fff}
.edit-area{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  font-family:"Source Han Serif SC","Songti SC",Georgia,serif;font-size:14.5px;line-height:1.95;
  min-height:420px;background:#fff
}
.edit-area.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.8px;line-height:1.75;min-height:300px}

/* 版本 / 文章列表 */
.item{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;overflow:hidden}
.item.on{border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,138,103,.1)}
.item-h{padding:9px 12px;display:flex;align-items:center;gap:9px;background:var(--panel2);cursor:pointer}
.item-h .t{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-h .m{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.item-b{padding:12px 14px;border-top:1px solid var(--line2)}
.badge{font-size:11px;padding:1.5px 7px;border-radius:20px;background:var(--line);color:var(--ink2);white-space:nowrap}
.badge.ok{background:#dcefe5;color:#1d6146}
.badge.warn{background:#f6e6cd;color:#7d5514}
.badge.bad{background:#f7dcdc;color:#8e2f2f}
.badge.info{background:#dde9f5;color:#27506f}

.wc{font-size:12px;color:var(--ink3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wc .bar{width:88px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.wc .bar i{display:block;height:100%;background:var(--green2)}
.wc .bar i.out{background:#d09a2f}
.wc .bar i.over{background:var(--red)}

/* 状态 */
.status{font-size:12.5px;color:var(--ink2);padding:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--green2);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.log{background:#1f2724;color:#d7e3da;border-radius:9px;padding:10px 12px;font-family:"Cascadia Mono",Consolas,monospace;
  font-size:12px;line-height:1.65;max-height:180px;overflow:auto;white-space:pre-wrap}
.log .g{color:#7fd2a8}.log .y{color:#e0c069}.log .r{color:#e89090}

/* 弹窗 / 提示 */
.mask{position:fixed;inset:0;background:rgba(24,32,28,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px}
.modal-h .spacer{flex:1}
.modal-b{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--panel2);flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1f2724;color:#fff;
  padding:10px 20px;border-radius:24px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  max-width:min(86vw,520px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.28)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:26px 10px}
.empty .big{font-size:32px;opacity:.35;display:block;margin-bottom:8px}
.secttl{font-size:12.5px;color:var(--ink3);margin:14px 0 8px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.secttl:first-child{margin-top:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mono-s{font-family:"Cascadia Mono",Consolas,monospace;font-size:11.8px}
details.acc{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
details.acc > summary{padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;list-style:none}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::before{content:"▸ ";color:var(--green2)}
details.acc[open] > summary::before{content:"▾ "}
details.acc .acc-b{padding:0 12px 12px;font-size:13px;color:var(--ink2)}
details.acc .acc-b ul{margin:5px 0;padding-left:20px}
details.acc .acc-b li{margin:3px 0}
mark{background:#fff2b8;padding:0 2px;border-radius:2px}
.topbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.tb-btn:hover{background:rgba(255,255,255,.28);color:#fff;border-color:rgba(255,255,255,.5)}
.tb-ico{display:none;font-size:15px;line-height:1}

/* =========================================================
   手机 / 平板适配
   ========================================================= */
/* 统一的多行输入框：移动端给足高度，且禁止小屏横向拉伸 */
.ta{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
  line-height:1.7;font-size:14px;resize:vertical;outline:none}
.ta:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,138,103,.12)}

@media(max-width:1080px){
  .grid{grid-template-columns:1fr}
  /* 侧栏改为抽屉 */
  .menu-btn{display:flex}
  .side{
    position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:30;
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:6px 0 26px rgba(0,0,0,.2);border-right:1px solid var(--line);
    padding-top:env(safe-area-inset-top)
  }
  .side.open{transform:translateX(0)}
  /* 平板上品牌说明与状态条都收掉，避免顶栏换行 */
  .brand small{display:none}
  .tb-meta{display:none}
}
@media(max-width:760px){
  .brand{font-size:15.5px}
  .brand .bk{width:19px;height:22px}
  /* 顶栏按钮收成图标，保证一行放得下 */
  .tb-txt{display:none}
  .tb-ico{display:inline}
  .tb-btn{padding:8px 10px;min-width:36px;text-align:center}
  .topbar{gap:9px}
  .topbtns{gap:6px;flex-wrap:nowrap}
  .tb-meta{gap:6px;flex-wrap:nowrap;overflow:hidden}
  .topbar{gap:7px}
  .topbar-tools{min-width:0;flex:0 1 auto}
  .brand{min-width:0;flex:0 1 auto}
  .work{padding:12px}
  .card{border-radius:11px}
  .card-h{padding:10px 12px;gap:7px;flex-wrap:wrap}
  .card-h h3{font-size:14px}
  .card-h .hint{font-size:11.5px}
  .card-b{padding:12px}
  .split{grid-template-columns:1fr}
  .log{font-size:11.5px;max-height:150px}
  .doc{font-size:12.2px;padding:11px 12px;max-height:340px}
  .doc.serif,.edit-area{font-size:15px;line-height:1.9}
  .edit-area{min-height:300px;padding:12px}
  /* 触摸目标放大规则见下方 @media(pointer:coarse)，此处只处理版式 */
  .item-h{padding:11px 12px;flex-wrap:wrap;gap:6px}
  .item-h .t{max-width:100%;white-space:normal;line-height:1.45}
  .item-h .m{font-size:11px}
  .btnbar{gap:7px}
  .kv{grid-template-columns:auto 1fr;font-size:12.5px}
  .kv dd{word-break:break-word}
  .modal{border-radius:12px;max-height:92vh;max-height:92dvh}
  .modal-h{padding:12px 14px;font-size:14.5px}
  .modal-b{padding:13px 14px}
  .modal-f{padding:11px 14px}
  .modal-f .btn{flex:1;text-align:center;justify-content:center}
  .mask{padding:0;align-items:flex-end}
  .modal{max-width:100%;width:100%;border-radius:14px 14px 0 0;max-height:94dvh}
  .modal-f{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  .mask{padding-bottom:0}
  .toast{bottom:18px;bottom:calc(18px + env(safe-area-inset-bottom));font-size:13px;padding:10px 16px}
  details.acc > summary{padding:11px 12px;font-size:13.5px}
  input[type=text],input[type=password],input[type=number],select,textarea{font-size:16px}
  .ta{font-size:16px}
  .item-h .t{font-size:13.5px}
  .wc{font-size:11.5px}
  .proj{padding:12px 12px}
  .side-h,.side-f{padding-left:12px;padding-right:12px}
  .empty{padding:22px 8px}
  .pop-width{max-width:100%}
}
/* 触屏设备：取消 hover 残留效果 */
@media(hover:none){
  .btn:hover{border-color:var(--line);color:var(--ink);background:#fff}
  .btn.pri:hover{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.ghost:hover{background:transparent;color:var(--ink2)}
  .btn.warn:hover{background:#fff;border-color:#e6cdc0;color:#8a4a1f}
  .btn.danger:hover{background:#fff;border-color:#eccfcf;color:var(--red)}
  .chip:hover{border-color:var(--line);background:#fff}
  .chip.on:hover{background:var(--green);border-color:var(--green);color:#fff}
  .tab:hover{background:transparent}
  .tab.on:hover{background:var(--bg)}
  .proj:hover{background:transparent;border-color:transparent}
  .proj.on:hover{background:var(--greensoft);border-color:#c3ddd1}
}
/* 触摸设备：放大触摸目标。
   为什么用 pointer:coarse 而不是只按屏幕宽度：iPad 和手机横屏屏幕很宽，
   但同样是手指操作，只按宽度判断会漏掉它们。 */
@media(pointer:coarse){
  *{-webkit-tap-highlight-color:transparent}
}
/* 触摸目标放大：两条通道都要覆盖。
   ① 粗指针（真手机/平板）
   ② 窄视口（桌面浏览器把窗口拉窄时 pointer 仍是 fine，只有宽度条件能命中）
   两条规则写在一起，确保任何一条成立都生效。 */
@media(pointer:coarse), (max-width:820px){
  .btn{padding:10px 14px;font-size:14px;border-radius:9px}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:7px}
  .chip{padding:9px 14px;font-size:13.5px}
  .proj{padding:12px}
  details.acc > summary{padding:11px 12px;font-size:13.5px}
  .item-h{padding:11px 12px}
  /* 窄屏/触摸设备上隐去文种后的模块小字，一行能放2—3个文种，少滑几屏 */

/* ------------------------- 存储层（三级降级） -------------------------
   有些环境根本不给用 localStorage：微信内置浏览器、iOS 无痕模式、
   某些安卓文件管理器自带的预览器、file:// 下被策略禁用的情形。
   原来的写法一失败就弹提示，而且每敲一个字弹一次。
   这里改成：localStorage → sessionStorage → 纯内存，只提示一次，
   并且把当前状态暴露给界面，让用户知道数据到底存在哪。 */
const MEM = { data:null };
const STORE_MODE = { kind:'memory', label:'未检测', warnShown:false };

function probeStorage(){
  const testKey = '__yyw_test__';
  const tryStore = (name, get) => {
    try {
      const s = get();
      if(!s) return false;
      s.setItem(testKey, '1');
      const ok = s.getItem(testKey) === '1';
      s.removeItem(testKey);
      return ok;
    } catch(e){ return false; }
  };
  if(tryStore('localStorage', ()=>window.localStorage)){
    STORE_MODE.kind = 'local'; STORE_MODE.label = '浏览器本地存储（可长期保存）'; return;
  }
  if(tryStore('sessionStorage', ()=>window.sessionStorage)){
    STORE_MODE.kind = 'session'; STORE_MODE.label = '临时存储（关掉浏览器会清空，建议随时导出备份）'; return;
  }
  STORE_MODE.kind = 'memory'; STORE_MODE.label = '仅内存（关掉页面就没了，请务必用“导出备份”保存到文件）';
}
probeStorage();

function storageGet(){
  try{
    if(STORE_MODE.kind === 'local') return window.localStorage.getItem(STORE_KEY);
    if(STORE_MODE.kind === 'session') return window.sessionStorage.getItem(STORE_KEY);
  }catch(e){}
  return MEM.data;
}
function storageSet(str){
  try{
    if(STORE_MODE.kind === 'local'){ window.localStorage.setItem(STORE_KEY, str); return true; }
    if(STORE_MODE.kind === 'session'){ window.sessionStorage.setItem(STORE_KEY, str); return true; }
  }catch(e){
    // 写满了或被中途禁用：降级，避免继续报错
    STORE_MODE.kind = 'memory';
    STORE_MODE.label = '仅内存（存储空间不可用，请导出备份）';
    MEM.data = str;
    return false;
  }
  MEM.data = str;
  return STORE_MODE.kind === 'memory' ? false : true;
}

/* 保存：绝不弹错、绝不每键一次提示 */
let _saveWarned = false, _saveFailStreak = 0;
function save(){
  let str;
  try{ str = JSON.stringify(ST); }
  catch(e){ return; }              // 序列化失败（循环引用等）静默跳过
  const ok = storageSet(str);
  if(ok){ _saveFailStreak = 0; return; }
  _saveFailStreak++;
  // 只在第一次、且确实写不进去时提示一次；之后交给界面上的状态条常驻显示
  if(!_saveWarned){
    _saveWarned = true;
    toast('这个浏览器不让自动保存，数据暂存在内存里。请用「备份」→「导出备份」存成文件。', 6000);
  }
  renderTop();
}
function storageBytes(){
  const s = storageGet();
  return s ? Math.round(s.length/1024) : 0;
}

/* ------------------------- 六、API ------------------------- */
async function callAPI(messages, opts){
  opts = opts||{};
  const s = ST.settings;
  if(!s.apiKey) throw new Error('未填写 API Key（可在右上角“接口设置”里填写，或改用导出提示词模式）');
  const url = s.baseUrl.replace(/\/+$/,'') + '/chat/completions';
  const body = {
    model: s.model || 'deepseek-chat',
    messages: messages,
    temperature: (opts.temperature==null?0.92:opts.temperature),
    max_tokens: opts.maxTokens || 4000,
    stream: false
  };
  if(opts.json) body.response_format = {type:'json_object'};
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let t=''; try{ t = await res.text(); }catch(e){}
    throw new Error('接口返回 '+res.status+'：'+t.slice(0,300));
  }
  const data = await res.json();
  const txt = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if(!txt) throw new Error('接口返回内容为空');
  return txt;
}

function parseArticle(raw){
  let t = (raw||'').trim();
  t = t.replace(/^```[a-zA-Z]*\s*/,'').replace(/```\s*$/,'').trim();
  let title='', body='';
  let m = t.match(/TITLE\s*[:：]\s*(.+)/);
  if(m) title = m[1].trim();
  let bi = t.search(/BODY\s*[:：]/);
  if(bi>=0){ body = t.slice(bi).replace(/^BODY\s*[:：]\s*/,'').trim(); }
  else { body = t.replace(/^TITLE\s*[:：].*$/m,'').trim(); }
  title = title.replace(/^[《“"]|[》”"]$/g,'').trim();
  if(!title){
    const first = body.split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';
    if(first.length<=40 && !/[。，；：]$/.test(first)) { title = first.replace(/^[《“"]|[》”"]$/g,''); }
    else title = '（未命名）';
  }
  return {title:title, body:body};
}

/* ------------------------- 七、工具：去AI味扫描 & 提示词自检 ------------------------- */
function scanAI(text){
  const hits = [];
  AI_WORDS.forEach(w=>{ if(w.indexOf('……')<0 && text.indexOf(w)>=0) hits.push(w); });
  const stats = {
    emoji: (text.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu)||[]).length,
    mdBold: (text.match(/\*\*/g)||[]).length,
    dash: (text.match(/——/g)||[]).length,
    englishQuote: (text.match(/[""]/g)||[]).length,
    exclaim: (text.match(/！/g)||[]).length
  };
  const paras = text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>10);
  const lens = paras.map(p=>countChars(p));
  stats.paras = paras.length;
  if(lens.length>2){
    const avg = lens.reduce((a,b)=>a+b,0)/lens.length;
    const varc = Math.sqrt(lens.reduce((a,b)=>a+(b-avg)*(b-avg),0)/lens.length)/avg;
    stats.avgPara = Math.round(avg);
    stats.variation = Math.round(varc*100)/100;
  } else { stats.avgPara=0; stats.variation=0; }
  return {hits:hits, stats:stats};
}

        }catch(e){ info = '（内容无法解析）'; }
        return '<div class="btnbar" style="margin-bottom:8px"><span style="flex:1" class="tip">存档 '+esc(f.k)+'　'+esc(info)+'　'+Math.round(f.len/1024)+' KB</span>'+
          '<button class="btn sm pri" onclick="UI.doRecover('+i+')">恢复这份</button></div>';
      }).join(''),
      '', true);
    window.__recoverList = list;
  },
  doRecover(i){
    const f = (window.__recoverList||[])[i];
    if(!f){ toast('存档已失效'); return; }
    try{
      const o = JSON.parse(f.raw);
      if(!o.projects) throw new Error('格式不对');
      ST.projects = o.projects;
      if(o.settings){ ST.settings.baseUrl=o.settings.baseUrl||ST.settings.baseUrl; ST.settings.model=o.settings.model||ST.settings.model; }
      ST.currentId = ST.projects[0] ? ST.projects[0].id : null;
      save(); UI.closeModal(); renderAll();
      toast('已恢复 '+ST.projects.length+' 个项目', 3000);
    }catch(e){ toast('恢复失败：'+e.message); }
  },
  exportAll(){
    const blob = new Blob([JSON.stringify({projects:ST.projects,settings:{baseUrl:ST.settings.baseUrl,model:ST.settings.model,mode:ST.settings.mode}},null,2)],{type:'application/json'});
    downloadBlob(blob, '应用文写作工坊-备份-'+Date.now()+'.json');

  },
  importAll(inp){
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const o = JSON.parse(rd.result);
        if(!o.projects) throw new Error('文件格式不对');
        ST.projects = o.projects;
        if(o.settings){ ST.settings.baseUrl=o.settings.baseUrl||ST.settings.baseUrl; ST.settings.model=o.settings.model||ST.settings.model; ST.settings.mode=o.settings.mode||ST.settings.mode; }
        ST.currentId = ST.projects[0] ? ST.projects[0].id : null;
        save(); UI.closeModal(); renderAll(); toast('导入成功');
      }catch(e){ toast('导入失败：'+e.message); }
    };
    rd.readAsText(f,'utf-8');
  },
  wipe(){
    if(!confirm('确定清空本机所有项目数据？此操作不可撤销。\n建议先导出备份。')) return;
    try{
      window.localStorage.removeItem(STORE_KEY);
      window.sessionStorage.removeItem(STORE_KEY);
    }catch(e){}
    MEM.data = null;
    location.reload();
  }
};

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function downloadText(text, filename){
  const blob = new Blob(['\ufeff'+text], {type:'text/plain;charset=utf-8'});
  downloadBlob(blob, filename);
}

  /* ---------- 阶段三：出稿 ---------- */
  async generate(){
    const p = P();
    if(!p.prompts.length){ toast('请先在“提示词打磨”里生成提示词'); ST.ui.tab='prompt'; renderAll(); return; }
    if(busy){ toast('正在生成中，请稍候'); return; }
    const cur = p.prompts[p.curPrompt];
    const n = Math.max(1, Math.min(20, parseInt(p.req.count)||1));

    if(ST.settings.mode==='manual' || !ST.settings.apiKey){
      const lines = [];
      for(let i=0;i<n;i++){ lines.push('=========== 第 '+(i+1)+' 篇（变化要求：'+seedLine(i)+'） ===========\n'+cur.text); }
      openModal('无 Key 模式：请把下面 '+n+' 份提示词分别投喂给对话模型',
        '<div class="note" style="margin-bottom:10px">每份提示词的“变化要求”都不同，这样生成出来的文章才不是同一篇的复制品。生成后把结果粘回“成品修改”里即可继续改。</div>'+
        '<div class="doc">'+esc(lines.join('\n\n\n'))+'</div>',
        '<button class="btn" onclick="copyText(document.querySelector(\'#modal .doc\').textContent);toast(\'已复制全部\')">复制全部</button>'+
        '<button class="btn pri" onclick="UI.closeModal()">知道了</button>');
      return;
    }

    busy=true; renderGenPanel();
    App.log('开始生成 '+n+' 篇文章（文种：'+(curGenre()?curGenre().name:'自定义')+'，字数 '+p.req.wcMin+'—'+p.req.wcMax+'）');
    let done=0, fail=0;
    for(let i=0;i<n;i++){
      try{
        p.logs.unshift({t:nowStr().slice(11), msg:'正在生成第 '+(i+1)+'/'+n+' 篇……', cls:'y'});
        renderGenPanel();
        const variation = seedLine(i);
        const userMsg = cur.text + '\n\n==================== 七、本篇差异化要求（覆盖上一篇的写法） ====================\n'+
          '这是同一批任务的第 '+(i+1)+' 篇，必须与同批其他篇目明显不同：\n'+variation+
          '\n- 不要与同批其他篇目使用相同的单位名称、人名、标题句式；\n'+
          '- 具体时间、地点、活动名称、数据都要另设一套，不要套用你上一次写的；\n'+
          '- 标题不要只是换个数字，句式和落点要换。\n'+
          '\n再强调一遍字数：正文控制在 '+p.req.wcMin+'—'+p.req.wcMax+' 字之间。';
        let raw = await callAPI([
          {role:'system', content:'你是中文应用文写作实操写手，严格按用户给出的规范与字数写作。'},
          {role:'user', content:userMsg}
        ], {temperature:0.95, maxTokens:4000});
        let art = parseArticle(raw);
        let wc = countChars(art.body);

        // 字数校正，最多两轮
        for(let round=0; round<2; round++){
          if(wc>=p.req.wcMin && wc<=p.req.wcMax) break;
          const dir = wc < p.req.wcMin ? '不足' : '超出';
          const delta = wc < p.req.wcMin ? (p.req.wcMin - wc) : (wc - p.req.wcMax);
          p.logs.unshift({t:nowStr().slice(11), msg:'第 '+(i+1)+' 篇字数'+dir+' '+delta+' 字，自动修正（第 '+(round+1)+' 轮）', cls:'y'});
          renderGenPanel();
          const fixMsg = wc < p.req.wcMin
            ? '下面这篇应用文只有 '+wc+' 字，比要求的 '+p.req.wcMin+' 字少了 '+delta+' 字。请在不改变文种体例、不注水的前提下，补充具体的过程、分工、时间节点、数据和必要的分条内容，把它扩写到 '+p.req.wcMin+'—'+p.req.wcMax+' 字。仍然禁止 AI 腔，不要写空话。\n\n【现文】\n'+art.body+'\n\n只输出扩写后的完整正文，第一行仍用 TITLE: 开头。'
            : '下面这篇应用文有 '+wc+' 字，超出要求的 '+p.req.wcMax+' 字 '+delta+' 字。请删掉重复表述、空泛评论和可有可无的修饰，保留全部必要信息和格式要素，压到 '+p.req.wcMin+'—'+p.req.wcMax+' 字。\n\n【现文】\n'+art.body+'\n\n只输出精简后的完整正文，第一行仍用 TITLE: 开头。';
          const fixed = await callAPI([
            {role:'system', content:'你是中文应用文写作实操写手，严格按字数要求修改文稿，禁止注水、禁止AI腔。'},
            {role:'user', content:fixMsg}
          ], {temperature:0.5, maxTokens:4000});
          const a2 = parseArticle(fixed);
          if(countChars(a2.body) === wc) break;
          art = a2; wc = countChars(art.body);
        }

        const scan = scanAI(art.body);
        p.articles.push({
          id: uid(), title: art.title, body: art.body, wc: wc, time: nowStr(),
          seed: variation, note:'第 '+(i+1)+' 篇　'+varianceNote(variation),
          history:[], aiHits: scan.hits, stats: scan.stats
        });
        p.logs.unshift({t:nowStr().slice(11), msg:'第 '+(i+1)+' 篇完成：《'+art.title+'》'+wc+' 字'+(scan.hits.length?('　⚠ 疑似AI味词：'+scan.hits.slice(0,5).join('、')):'　干净'), cls: scan.hits.length?'y':'g'});
        done++;
        save(); renderAll();
      }catch(e){
        fail++;
        p.logs.unshift({t:nowStr().slice(11), msg:'第 '+(i+1)+' 篇失败：'+e.message, cls:'r'});
        renderGenPanel();
      }
    }
    busy=false; save(); renderAll();
    toast('完成 '+done+' 篇'+(fail?('，失败 '+fail+' 篇'):''), 3000);
  },

      if(a.body.indexOf(rep.from)<0){ toast('没找到要替换的文字：'+rep.from.slice(0,20)); return; }
      App.snapshot(id,'替换前');

function seedLine(i){
  const o = SEED_ORGS[i % SEED_ORGS.length];
  const pl = SEED_PLACES[(i*3+1) % SEED_PLACES.length];
  const nm = SEED_NAMES[(i*5+2) % SEED_NAMES.length];
  const an = SEED_ANGLES[i % SEED_ANGLES.length];
  const stt = SEED_STRUCT[(i*2) % SEED_STRUCT.length];
  return '- 切入角度：'+an+'\n- '+stt+'\n- 本篇主要单位/场景设定用：'+o+'、'+pl+'、主要人物/联系人用“'+nm+'”（可另加1—2个配角姓名）\n- 段落开头不要与本批其他篇重复（不要都用“为了……”开头）';
}
function varianceNote(seed){
  const m = seed.match(/切入角度：(.+)/); return m? m[1].slice(0,18) : '差异化';
}
function parseReplace(instr){
  let m = instr.match(/把[“"](.+?)[”"]\s*(?:改|换)成[“"](.*?)[”"]/);
  if(m) return {from:m[1], to:m[2]};
  m = instr.match(/将[“"](.+?)[”"]\s*(?:改|换|替换)为[“"](.*?)[”"]/);
  if(m) return {from:m[1], to:m[2]};
  m = instr.match(/[“"](.+?)[”"]\s*替换为\s*[“"](.*?)[”"]/);
  if(m) return {from:m[1], to:m[2]};
  m = instr.match(/^替换[：:]\s*(.+?)\s*(?:=>|→|->)\s*(.+)$/);
  if(m) return {from:m[1], to:m[2]};
  return null;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function exportWord(articles, filename){
  let inner = '';
  articles.forEach((a,i)=>{
    if(articles.length>1) inner += '<h2>第 '+(i+1)+' 篇　'+esc(a.title)+'</h2>';
    else inner += '<h1>'+esc(a.title)+'</h1>';
    a.body.split('\n').forEach(line=>{
      const t = line.trim();
      if(!t){ inner += '<p class="emp">&nbsp;</p>'; return; }
      const isTitle = /^[一二三四五六七八九十]+、/.test(t) || /^（[一二三四五六七八九十]+）/.test(t);
      inner += '<p'+(isTitle?' class="h"':'')+'>'+esc(line).replace(/^ +/g, m=>'&nbsp;'.repeat(m.length))+'</p>';
    });
    inner += '<p class="emp">&nbsp;</p>';
  });
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>'+esc(filename)+'</title>'+
    '<style>@page{size:A4;margin:2.54cm 3.17cm}body{font-family:"宋体",SimSun;font-size:12pt;line-height:1.9}h1{font-family:"黑体",SimHei;font-size:16pt;text-align:center;margin:0 0 18pt}h2{font-family:"黑体",SimHei;font-size:14pt;margin:22pt 0 10pt}p{margin:0 0 6pt;text-indent:2em;text-align:justify}p.h{font-family:"黑体",SimHei;text-indent:2em}p.emp{text-indent:0}</style>'+
    '</head><body>'+inner+'</body></html>';
  const blob = new Blob(['\ufeff'+html], {type:'application/msword'});
  downloadBlob(blob, filename.replace(/[\\/:*?"<>|]/g,'_')+'.doc');
  toast('已导出 Word（.doc，可直接用 Word 打开编辑）');
}

function articleCard(a, i, compact){
  const p=P();
  const inRange = a.wc>=p.req.wcMin && a.wc<=p.req.wcMax;
  const ratio = Math.min(100, Math.round(a.wc/Math.max(1,p.req.wcMax)*100));
  const hits = (a.aiHits||[]);
  return '<div class="item">'+
    '<div class="item-h" onclick="App.openEdit(\''+a.id+'\')">'+
      '<span class="badge info">第 '+(i+1)+' 篇</span>'+
      '<span class="t">'+esc(a.title)+'</span>'+
      '<span class="m">'+a.wc+' 字</span>'+
      '<span class="badge '+(inRange?'ok':'warn')+'">'+(inRange?'字数达标':(a.wc<p.req.wcMin?'偏少':'偏多'))+'</span>'+
      (hits.length? '<span class="badge warn" title="'+esc(hits.join('、'))+'">AI味词 '+hits.length+'</span>':'<span class="badge ok">干净</span>')+
    '</div>'+
    '<div class="item-b">'+
      '<div class="doc serif" style="max-height:260px">'+esc(a.body.slice(0,900))+(a.body.length>900?'\n……（点标题展开编辑）':'')+'</div>'+
      '<div class="wc" style="margin-top:9px"><span class="bar"><i class="'+(inRange?'':'out')+'" style="width:'+ratio+'%"></i></span>'+
        '<span>要求 '+p.req.wcMin+'—'+p.req.wcMax+' 字，本篇 '+a.wc+' 字'+(inRange?'':'（超出区间）')+'</span></div>'+
      '<div class="btnbar" style="margin-top:9px">'+
        '<button class="btn sm" onclick="event.stopPropagation();App.openEdit(\''+a.id+'\')">打开修改</button>'+
        '<button class="btn sm" onclick="event.stopPropagation();App.copyArticle(\''+a.id+'\')">复制</button>'+
        '<button class="btn sm" onclick="event.stopPropagation();App.exportArticle(\''+a.id+'\')">TXT</button>'+
        '<button class="btn sm" onclick="event.stopPropagation();App.exportArticleDoc(\''+a.id+'\')">Word</button>'+
        '<button class="btn sm" onclick="event.stopPropagation();App.regenOne(\''+a.id+'\')">换一篇重写</button>'+
        '<button class="btn sm danger" onclick="event.stopPropagation();App.delArticle(\''+a.id+'\')">删除</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

}

App.quickFix = function(id, word){
  const a = P().articles.find(x=>x.id===id); if(!a) return;
  App.snapshot(id,'删除套话“'+word+'”前');
  a.body = a.body.split(word).join('');
  a.body = a.body.replace(/，，/g,'，').replace(/。，/g,'。').replace(/，。/g,'。');
  a.wc = countChars(a.body);
  const s = scanAI(a.body); a.aiHits=s.hits; a.stats=s.stats;
  save(); renderAll(); toast('已删除“'+word+'”');
};

/* ------------------------- 十一、启动与移动端适配 ------------------------- */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ UI.closeModal(); UI.closeDrawer(); }
});
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='mask') UI.closeModal();
});

/* 页面被隐藏（切后台/锁屏）时立刻存盘，手机上最怕切出去丢数据 */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide', ()=>save());
window.addEventListener('beforeunload', ()=>save());
window.addEventListener('blur', ()=>save());

/* 旋转屏幕 / 变宽后自动收起抽屉，避免遮住内容 */
let _lastMobile = null;
function onViewportChange(){
  const m = UI.isMobile();
  if(_lastMobile === null) { _lastMobile = m; return; }
  if(m !== _lastMobile){ _lastMobile = m; if(!m) UI.closeDrawer(); }
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ onViewportChange(); renderAll(); }, 260); });

/* 打开时若是手机，默认不展开抽屉 */
if(UI.isMobile()) UI.closeDrawer();

load();
renderAll();
</script>
</body>
